<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>Angri</title>
<style>
  :root {
    --fondo: #f6f5f2; --panel: #ffffff; --texto: #1d1f23; --suave: #6b6f78; --borde: #e3e1dc;
    --angri: #eef1f6; --vos: #2f5d50; --vos-texto: #ffffff; --acento: #2f5d50;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #14161a; --panel: #1c1f24; --texto: #e7e7e4; --suave: #9a9ea6; --borde: #2c3037;
      --angri: #23272e; --vos: #3c7a68; --vos-texto: #ffffff; --acento: #6fb39e;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--fondo); color: var(--texto);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--borde); background: var(--panel);
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
  #situacion { font-size: 13px; color: var(--suave); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav { display: flex; gap: 4px; }
  nav button {
    border: 1px solid var(--borde); background: transparent; color: var(--texto);
    padding: 6px 12px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer;
  }
  nav button[aria-selected="true"] { background: var(--acento); border-color: var(--acento); color: #fff; }
  main { flex: 1; overflow: hidden; display: flex; flex-direction: column; max-width: 760px; width: 100%; margin: 0 auto; }
  section { flex: 1; overflow-y: auto; padding: 16px; display: none; }
  section.activa { display: block; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; margin: 6px 0; white-space: pre-wrap; word-wrap: break-word; }
  .angri { background: var(--angri); border-bottom-left-radius: 4px; }
  .vos { background: var(--vos); color: var(--vos-texto); margin-left: auto; border-bottom-right-radius: 4px; }
  .aviso { color: var(--suave); font-size: 14px; text-align: center; margin: 10px 0; }
  .pensando::after { content: "…"; animation: puntos 1.2s infinite; }
  @keyframes puntos { 50% { opacity: .2; } }
  form {
    display: flex; gap: 8px; padding: 10px 16px; padding-bottom: max(10px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--borde); background: var(--panel);
  }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--borde); border-radius: 12px; padding: 10px 12px;
    font: inherit; background: var(--fondo); color: var(--texto); max-height: 140px;
  }
  form button {
    border: 0; border-radius: 12px; padding: 0 16px; font: inherit; font-weight: 600;
    background: var(--acento); color: #fff; cursor: pointer;
  }
  form button:disabled { opacity: .5; cursor: default; }
  .chips { display: flex; gap: 8px; padding: 0 16px 8px; flex-wrap: wrap; }
  .chips button {
    border: 1px solid var(--borde); background: var(--panel); color: var(--texto);
    border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 14px; cursor: pointer;
  }
  h2 { font-size: 15px; color: var(--suave); font-weight: 600; margin: 20px 0 8px; text-transform: uppercase; letter-spacing: .05em; }
  h2:first-child { margin-top: 0; }
  .tarjeta { background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; padding: 10px 14px; margin: 6px 0; }
  .barra { height: 6px; background: var(--borde); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .barra > div { height: 100%; background: var(--acento); }
  .chico { color: var(--suave); font-size: 14px; }
  .cifras { display: flex; gap: 10px; }
  .cifras .tarjeta { flex: 1; text-align: center; }
  .cifras b { display: block; font-size: 22px; }
  #clave { max-width: 420px; margin: 40px auto; text-align: center; }
  #clave input { width: 100%; padding: 10px; font: inherit; border-radius: 10px; border: 1px solid var(--borde); background: var(--panel); color: var(--texto); margin: 10px 0; }
</style>
</head>
<body>
<header>
  <h1>Angri</h1>
  <span id="situacion"></span>
  <nav role="tablist">
    <button role="tab" data-ver="charla" aria-selected="true">Charla</button>
    <button role="tab" data-ver="anda" aria-selected="false">Qué anda haciendo</button>
  </nav>
</header>
<main>
  <section id="charla" class="activa" aria-live="polite"></section>
  <section id="anda"></section>
  <div class="chips" id="chips"><button type="button" id="btn-novedades">Novedades</button></div>
  <form id="form">
    <textarea id="entrada" rows="1" placeholder="Escribile a Angri…" autocomplete="off"></textarea>
    <button id="enviar">Enviar</button>
  </form>
</main>

<script>
const $ = (s) => document.querySelector(s);
let sesion = null;
let clave = new URLSearchParams(location.search).get("clave");
try {
  if (clave) { localStorage.setItem("angri-clave", clave); history.replaceState(null, "", "/"); }
  else clave = localStorage.getItem("angri-clave");
} catch (e) {}

function pedirClave() {
  $("main").innerHTML = '<div id="clave"><p>Falta la clave. En angri, corré <code>angri web</code> y abrí el enlace que muestra, o pegá la clave acá:</p>'
    + '<input id="c" autocomplete="off"><button class="chips" id="ok">Entrar</button></div>';
  $("#ok").onclick = () => { try { localStorage.setItem("angri-clave", $("#c").value.trim()); } catch (e) {} location.reload(); };
}

async function api(ruta, cuerpo) {
  const r = await fetch(ruta, {
    method: cuerpo ? "POST" : "GET",
    headers: { "X-Clave": clave || "", "Content-Type": "application/json" },
    body: cuerpo ? JSON.stringify({ ...cuerpo, sesion }) : undefined,
  });
  if (r.status === 401) { pedirClave(); throw new Error("clave"); }
  const datos = await r.json();
  if (datos.sesion) sesion = datos.sesion;
  if (!r.ok) throw new Error(datos.error || "error");
  return datos;
}

function burbuja(quien, texto) {
  const d = document.createElement("div");
  d.className = "msg " + quien;
  d.textContent = texto;
  $("#charla").appendChild(d);
  $("#charla").scrollTop = $("#charla").scrollHeight;
  return d;
}
function aviso(texto) {
  const d = document.createElement("div");
  d.className = "aviso"; d.textContent = texto;
  $("#charla").appendChild(d);
  return d;
}

let ocupado = false;
async function enviar(ruta, cuerpo, mostrarVos) {
  if (ocupado) return;
  ocupado = true; $("#enviar").disabled = true;
  if (mostrarVos) burbuja("vos", mostrarVos);
  const espera = burbuja("angri pensando", "");
  try {
    const d = await api(ruta, cuerpo);
    if (d.texto) { espera.className = "msg angri"; espera.textContent = d.texto; }
    else espera.remove();
    return d;
  } catch (e) {
    espera.remove();
    if (e.message !== "clave") aviso(e.message);
  } finally {
    ocupado = false; $("#enviar").disabled = false;
    $("#charla").scrollTop = $("#charla").scrollHeight;
  }
}

$("#form").onsubmit = (e) => {
  e.preventDefault();
  const t = $("#entrada").value.trim();
  if (!t || ocupado) return;
  $("#entrada").value = ""; $("#entrada").style.height = "";
  enviar("/api/mensaje", { texto: t }, t);
};
$("#entrada").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer: coarse)").matches) { e.preventDefault(); $("#form").requestSubmit(); }
});
$("#entrada").addEventListener("input", (e) => { e.target.style.height = ""; e.target.style.height = e.target.scrollHeight + "px"; });
$("#btn-novedades").onclick = () => enviar("/api/novedades", {}, "Novedades");

function el(tag, clase, texto) { const e = document.createElement(tag); if (clase) e.className = clase; if (texto != null) e.textContent = texto; return e; }

async function cargarEstado() {
  const s = await api("/api/estado");
  $("#situacion").textContent = s.situacion + (s.mensajes_sin_leer ? ` · ${s.mensajes_sin_leer} sin leer` : "");
  const a = $("#anda"); a.replaceChildren();
  const cifras = el("div", "cifras");
  for (const [n, t] of [[s.lecturas_hoy, "lecturas hoy"], [s.notas_total, "notas"], [s.temas.length, "temas"]]) {
    const c = el("div", "tarjeta"); c.append(el("b", "", n), el("span", "chico", t)); cifras.append(c);
  }
  a.append(cifras);
  a.append(el("h2", "", "Lo que le interesa"));
  if (!s.temas.length) a.append(el("p", "chico", "Todavía no se formó ningún tema."));
  for (const t of s.temas) { const c = el("div", "tarjeta"); c.append(el("div", "", t.nombre), el("div", "chico", `${t.notas} notas · peso ${t.peso}`)); a.append(c); }
  a.append(el("h2", "", "Investigando"));
  if (!s.investigando.length) a.append(el("p", "chico", "Nada abierto ahora."));
  for (const o of s.investigando) {
    const c = el("div", "tarjeta"); c.append(el("div", "", o.pregunta), el("div", "chico", `${o.gastado} de ${o.presupuesto} lecturas`));
    const b = el("div", "barra"), r = el("div"); r.style.width = (100 * o.gastado / o.presupuesto) + "%"; b.append(r); c.append(b); a.append(c);
  }
  if (s.cerradas.length) {
    a.append(el("h2", "", "Cerradas"));
    for (const o of s.cerradas) { const c = el("div", "tarjeta"); c.append(el("div", "", o.pregunta), el("div", "chico", o.respuesta || o.estado)); a.append(c); }
  }
  a.append(el("h2", "", "Diario de hoy"));
  if (!s.diario.length) a.append(el("p", "chico", "Hoy todavía no escribió nada."));
  for (const l of s.diario) a.append(el("div", "tarjeta", l.replace(/\*\*/g, "").replace(/\*/g, "")));
}

document.querySelectorAll("nav button").forEach((b) => b.onclick = () => {
  document.querySelectorAll("nav button").forEach((x) => x.setAttribute("aria-selected", x === b));
  document.querySelectorAll("section").forEach((x) => x.classList.toggle("activa", x.id === b.dataset.ver));
  const charla = b.dataset.ver === "charla";
  $("#form").style.display = charla ? "" : "none";
  $("#chips").style.display = charla ? "" : "none";
  if (!charla) cargarEstado().catch(() => {});
});

(async () => {
  if (!clave) return pedirClave();
  try { await cargarEstado(); } catch (e) { return; }
  const d = await enviar("/api/hola", {});
  if (d && !d.texto) aviso("Sin novedades por ahora. Escribile lo que quieras.");
})();
</script>
</body>
</html>
